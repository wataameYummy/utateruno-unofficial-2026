<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頒布物まとめ（非公式）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title">頒布物まとめ（非公式）</h1>
  <p class="notice">※ファンによる非公式まとめです。最新情報は各サークル様の告知をご確認ください。</p>
  <nav class="tabs">
    <button data-view="list" class="active">一覧</button>
    <button data-view="map">配置図</button>
  </nav>
  <div class="filters">
    <input id="q" type="search" placeholder="サークル名・頒布物・スペースで検索">
    <label><input type="checkbox" id="f-new"> 新刊/新作あり</label>
    <label><input type="checkbox" id="f-pay"> 電子決済可</label>
    <label><input type="checkbox" id="f-r18" checked> R-18を表示</label>
    <select id="f-kind"><option value="">種別：すべて</option></select>
  </div>
</header>

<main>
  <section id="view-list"></section>
  <section id="view-map" hidden>
    <p class="hint">スペースをタップすると詳細が開きます。検索に一致したスペースが強調されます。</p>
    <div id="map-wrap"></div>
  </section>
  <p id="status"></p>
</main>

<dialog id="detail">
  <button class="close" aria-label="閉じる">×</button>
  <div id="detail-body"></div>
</dialog>

<script src="vendor/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頒布物まとめ（非公式）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="site-title">頒布物まとめ（非公式）</h1>
  <p class="notice">※ファンによる非公式まとめです。最新情報は各サークル様の告知をご確認ください。</p>
  <nav class="tabs">
    <button data-view="about">概要</button>
    <button data-view="list">サークル一覧</button>
    <button data-view="map">配置図</button>
  </nav>
  <div class="filters">
    <input id="q" type="search" placeholder="サークル名・頒布物・スペースで検索">
    <label><input type="checkbox" id="f-new"> 新刊/新作あり</label>
    <select id="f-kind"><option value="">種別：すべて</option></select>
  </div>
</header>

<main>
  <section id="view-about"></section>
  <section id="view-list" hidden></section>
  <section id="view-map" hidden>
    <p class="hint">スペースをタップすると詳細が開きます。ドラッグで移動、＋－ボタン・ダブルクリック・ピンチ・Ctrl(⌘)＋ホイールで拡大縮小できます。</p>
    <div id="map-wrap">
      <div class="zoom-ctrl">
        <button id="zoom-in" aria-label="拡大">＋</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-out" aria-label="縮小">－</button>
        <button id="zoom-reset" aria-label="全体表示">全体</button>
      </div>
      <div id="map-svg-host"></div>
      <div id="map-tip" hidden></div>
      <div id="map-hint">Ctrl（Macは⌘）＋ホイールで拡大・縮小</div>
    </div>
  </section>
  <p id="status"></p>
</main>

<dialog id="detail">
  <button class="close" aria-label="閉じる">×</button>
  <div id="detail-body" tabindex="-1" autofocus></div>
</dialog>

<script src="vendor/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
